<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panadería Trigal - Cotizador de Pedidos</title>
  <!-- Bootstrap 5 CSS via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8">
        <div class="card shadow-sm">
          <div class="card-header bg-warning text-dark text-center py-3">
            <h1 class="h4 mb-0 font-weight-bold">Panadería Artesanal Trigal de Lima</h1>
            <small class="text-muted">Cotizador de Pedidos en Línea</small>
          </div>
          <div class="card-body p-4">
            
            <form id="formPedido" novalidate>
              
              <!-- Datos del Cliente -->
              <h5 class="border-bottom pb-2 mb-3 text-primary">1. Datos del Cliente</h5>
              
              <div class="row g-3">
                <div class="col-12 col-md-6">
                  <label for="nombre" class="form-label">Nombre completo:</label>
                  <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ej. Ana Torres">
                  <div class="invalid-feedback" id="errorNombre"></div>
                </div>

                <div class="col-12 col-md-6">
                  <label for="email" class="form-label">Correo electrónico:</label>
                  <input type="email" class="form-control" id="email" name="email" placeholder="ejemplo@correo.com">
                  <div class="invalid-feedback" id="errorEmail"></div>
                </div>

                <div class="col-12 col-md-6">
                  <label for="fecha" class="form-label">Fecha de entrega:</label>
                  <input type="date" class="form-control" id="fecha" name="fecha">
                  <div class="invalid-feedback" id="errorFecha"></div>
                </div>

                <div class="col-12 col-md-6">
                  <label for="modalidad" class="form-label">Modalidad de entrega:</label>
                  <select class="form-select" id="modalidad" name="modalidad">
                    <option value="retiro">Retiro en tienda (S/ 0.00)</option>
                    <option value="reparto">Reparto a domicilio (S/ 8.00)</option>
                  </select>
                </div>
              </div>

              <!-- Selección de Productos -->
              <h5 class="border-bottom pb-2 mt-4 mb-3 text-primary">2. Seleccione sus Productos</h5>
              
              <!-- Contenedor donde JS construirá los productos dinámicamente -->
              <div id="contenedorProductos" class="mb-3"></div>
              <div class="text-danger small mb-3 d-none" id="errorProductosGlobal"></div>

              <!-- Resumen Dinámico en Tiempo Real -->
              <div class="card bg-white border-warning my-4">
                <div class="card-body">
                  <h6 class="card-title text-uppercase fw-bold text-muted mb-3">Previsualización de Costos</h6>
                  <div class="d-flex justify-content-between mb-1">
                    <span>Subtotal:</span>
                    <strong id="lblSubtotal">S/ 0.00</strong>
                  </div>
                  <div class="d-flex justify-content-between mb-1 text-success">
                    <span>Descuento (10% si subtotal ≥ S/ 100):</span>
                    <strong id="lblDescuento">- S/ 0.00</strong>
                  </div>
                  <div class="d-flex justify-content-between mb-1">
                    <span>Cargo por Reparto:</span>
                    <strong id="lblReparto">S/ 0.00</strong>
                  </div>
                  <hr>
                  <div class="d-flex justify-content-between h5 mb-0 text-dark">
                    <span>Total Estimado:</span>
                    <strong id="lblTotal" class="text-success">S/ 0.00</strong>
                  </div>
                </div>
              </div>

              <!-- Botón de envío -->
              <div class="d-grid">
                <button type="submit" class="btn btn-warning btn-lg fw-bold">Generar Presupuesto</button>
              </div>

            </form>

          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
